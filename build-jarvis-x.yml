name: Build JARVIS X APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Extract JARVIS X project
        run: |
          unzip -q "Jarvis-X-Android-Enhanced.zip" -d extracted

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 34
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Build JARVIS X debug APK
        working-directory: extracted/jarvis-android
        run: gradle :app:assembleDebug --no-daemon

      - name: Upload JARVIS X APK
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-X-debug-APK
          path: extracted/jarvis-android/app/build/outputs/apk/debug/app-debug.apk
